name: CI Quality Gatekeeper

on:
  push:
    branches: [main, draft]
  pull_request:
    branches: [main, draft]

defaults:
  run:
    working-directory: web

jobs:
  quality-gate:
    name: Verify, Test & Build
    runs-on: ubuntu-latest
    env:
      # Endpoint dummy — build tidak butuh koneksi Supabase asli (lib/queries.ts
      # & proxy.ts sudah no-op kalau env ini tidak diisi/tidak valid),
      # jadi CI tetap hermetic (tidak bocor kredensial produksi, tidak
      # bergantung layanan eksternal).
      NEXT_PUBLIC_SUPABASE_URL: "http://127.0.0.1:54321"
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "test-anon-key"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Security dependency audit
        run: npm audit --audit-level=high

      # Strict quality gate: DILARANG pakai `|| true` yang meloloskan
      # error di sini (lihat AGENTS.md bagian 6).
      - name: Lint (strict, 0 warnings)
        run: npm run lint -- --max-warnings 0

      - name: Typecheck
        run: npm run typecheck

      # Coverage gate ini scoped ke modul murni yang sudah dites (lihat
      # vitest.config.mts) — jujur/enforceable untuk scope-nya, bukan
      # klaim seluruh codebase 80% tercover. Perluas scope seiring makin
      # banyak modul dapat test baru.
      - name: Unit tests + coverage gate
        run: npm run test:coverage

      - name: Build
        run: npm run build

  secret-scan:
    name: Secret Leak Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
